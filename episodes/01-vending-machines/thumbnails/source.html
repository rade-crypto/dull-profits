<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Libre Franklin';src:url(/home/user/dull-profits/tools/video/gfx/fonts/LibreFranklin-400.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:'Libre Caslon Display';src:url(/home/user/dull-profits/tools/video/gfx/fonts/LibreCaslonDisplay-400.woff2) format('woff2')}
@font-face{font-family:'Libre Caslon Text';src:url(/home/user/dull-profits/tools/video/gfx/fonts/LibreCaslonText-400.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Libre Caslon Text';src:url(/home/user/dull-profits/tools/video/gfx/fonts/LibreCaslonText-700.woff2) format('woff2');font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000}
.t{position:relative;width:1280px;height:720px;overflow:hidden;background:#0B1422;color:#fff;font-family:'Libre Franklin';margin-bottom:20px}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.abs{position:absolute}
.serif{font-family:'Libre Caslon Display';font-weight:400;line-height:.86;letter-spacing:-3px}
.sh{text-shadow:0 6px 40px rgba(0,0,0,.6)}
</style></head><body>

<!-- A: one familiar object (the soda can), the money sliced into The Split, one number the title doesn't say. -->
<div class="t" id="A">
  <div class="bg" style="background-image:url(src-can-bright.jpg);background-size:auto 112%;background-position:105% 30%;filter:saturate(.9) brightness(1.08) contrast(1.05)"></div>
  <div class="abs" style="inset:0;background:linear-gradient(90deg,#0B1422 0%,#0B1422 44%,rgba(11,20,34,.75) 56%,rgba(11,20,34,0) 72%)"></div>
  <div class="abs serif sh" style="left:58px;top:92px;font-size:400px">62¢</div>
  <div class="abs" style="left:66px;top:510px;width:700px;height:96px;display:flex;gap:6px">
    <div style="flex:11;background:#B65A86"></div><div style="flex:94;background:#4F7EC2"></div><div style="flex:13;background:#B88E30"></div><div style="flex:20;background:#16998A"></div>
    <div style="flex:62;background:#fff;display:flex;align-items:center;justify-content:center;font:800 40px 'Libre Franklin';color:#0B1422;letter-spacing:1px">OWNER</div>
  </div>
  <div class="abs" style="left:522px;top:494px;width:260px;height:128px;border:8px solid #FFE14D"></div>
</div>

<!-- B: The Deal File. The airport's contract line, highlighted. -->
<div class="t" id="B">
  <div class="bg" style="background-image:url(src-lax2.jpg);filter:blur(5px) brightness(.5) saturate(.85);transform:scale(1.06)"></div>
  <div class="abs" style="left:150px;top:62px;width:980px;height:600px;background:#F7F8F5;transform:rotate(-2.5deg);padding:52px 70px;color:#111827">
    <div style="font:800 70px 'Libre Franklin';letter-spacing:2px;border-bottom:6px solid #111827;padding-bottom:16px">LAX, 2023</div>
    <div style="font:400 34px/1.5 'Libre Caslon Text';color:#4a5160;margin-top:26px">…First Class will pay LAWA … $100 per machine or</div>
    <div style="margin-top:26px"><span style="background:#FFE14D;font:700 122px/1.1 'Libre Caslon Text';padding:0 16px;letter-spacing:-2px;white-space:nowrap">59.5 percent</span></div>
    <div style="font:400 34px/1.5 'Libre Caslon Text';color:#4a5160;margin-top:22px">of gross sales over the five-year term…</div>
  </div>
</div>

<!-- C (reserve): the payback, labelled and circled. -->
<div class="t" id="C">
  <div class="bg" style="background-image:url(src-machine.jpg);background-position:25% 50%;filter:brightness(.95)"></div>
  <div class="abs" style="inset:0;background:linear-gradient(270deg,#0B1422 0%,#0B1422 48%,rgba(11,20,34,.6) 64%,rgba(11,20,34,0) 82%)"></div>
  <div class="abs" style="left:560px;top:150px;width:100px;height:70px;background:#fff"></div>
  <div class="abs" style="left:560px;top:300px;width:660px;height:70px;background:#fff"></div>
  <div class="abs serif sh" style="left:556px;top:420px;font-size:200px;letter-spacing:-4px">14 years</div>
  <div class="abs" style="left:530px;top:392px;width:730px;height:250px;border:8px solid #FFE14D;border-radius:50%"></div>
</div>
</body></html>
