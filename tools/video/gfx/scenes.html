<!doctype html>

</style></head>
<body><div id="stage"></div>
<div aria-hidden="true" style="position:absolute;left:-9999px;top:0;opacity:0"><span style="font:500 20px 'Libre Franklin'">a1</span><span style="font:700 20px 'Libre Franklin'">a1</span><span class="h">a1</span><span style="font-family:'Libre Caslon Text'">a1</span><b style="font-family:'Libre Caslon Text'">a1</b></div>
<script>
// ---------------------------------------------------------------------------------------------
// Animation engine. Elements get data-in (cue name or seconds), data-anim, data-dur, data-out.
// draw(t) sets every element's state for time t (seconds from shot start) and returns a key that
// only changes while something is moving, so the renderer can reuse identical frames.
// ---------------------------------------------------------------------------------------------
const ROOT = document.getElementById('stage');
let S = ROOT, CAM = null, LAYERS = {}, GLASS = ROOT, CAMKEYS = [], SC = {};
let CUES = {}, TWEENS = [];
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const E = {
  linear: p => p,
  inOut: p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2, // moves between two resting places
  out: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),                         // easeOutExpo: arrivals
  outQuint: p => 1 - Math.pow(1 - p, 5),                                    // bars, rules, lines
  outCubic: p => 1 - Math.pow(1 - p, 3),                                    // opacity
  in: p => p * p * p,                                                       // easeInCubic: exits
  sine: p => -(Math.cos(Math.PI * p) - 1) / 2,                              // camera, routes, highlighter

const ease = E.inOut;
const ARRIVE = new Set(['up', 'rise', 'slide', 'pop', 'land']);
const DEF = { fade: 'outCubic', up: 'out', rise: 'out', land: 'out', slide: 'out', pop: 'outQuint', wipe: 'outQuint', grow: 'outQuint', growY: 'outQuint', hl: 'sine', count: 'out', dim: 'outCubic', fn: 'inOut' };
const cue = c => (c === undefined || c === null) ? 0 : (typeof c === 'number' ? c : !isNaN(parseFloat(c)) ? parseFloat(c) : (c in CUES ? CUES[c] : (() => { throw new Error('missing cue ' + c) })()));
function el(html, parent = S) { const d = document.createElement('div'); d.innerHTML = html.trim(); const n = d.firstElementChild; parent.appendChild(n); return n; }
const DUR = { fade: 0.5, up: 0.7, rise: 0.7, land: 0.9, pop: 0.5, wipe: 0.8, grow: 0.8, growY: 0.6, hl: 0.7, count: 1.2 };
function anim(node, opts) { const a = (opts && opts.anim) || 'fade'; TWEENS.push(Object.assign({ node, anim: a, dur: DUR[a] ?? 0.5, at: 0, base: node.style.transform || '' }, opts)); return node; }
const fmt = {
  money2: v => '$' + v.toFixed(2), money0: v => '$' + Math.round(v).toLocaleString('en-US'),

    case 'land': { const r = tw.rot ?? 0, hold = Math.max(0, t - a - tw.dur);
      n.style.opacity = o; n.style.transform = `translateY(${(1 - p) * (tw.dist ?? 140)}px) rotate(${(r + (1 - p) * (tw.turn ?? -3)).toFixed(3)}deg)`;
      n.style.boxShadow = 'none'; break; }
    case 'slide': n.style.opacity = o; n.style.transform = `translateX(${(1 - p) * -220}px)`; break;
    case 'pop': n.style.opacity = o; n.style.transform = `${tw.base} scale(${(tw.from ?? 0.6) + (1 - (tw.from ?? 0.6)) * p})`; break;
    case 'wipe': n.style.opacity = q; n.style.clipPath = `inset(0 ${(1 - p) * 100}% 0 0)`; break;
    case 'grow': n.style.opacity = q; n.style.transform = `scaleX(${p})`; n.style.transformOrigin = 'left center'; break;
    case 'growY': n.style.opacity = q; n.style.transform = `scaleY(${p})`; n.style.transformOrigin = tw.origin || 'center bottom'; break;

// Camera: every graphic sits in #cam > layers (far 0.7, mid 1, near 1.25). The camera always drifts and pushes a little,
// and camTo()/focusOn() add directed moves on cues. Footnotes sit on GLASS, outside the camera.
// A function of t that runs for the whole shot (hold motion, markers). It reports motion every frame.
function live(fn, node = ROOT) { return anim(node, { anim: 'fn', at: 0, dur: SC.dur || 8, ease: false, live: true, fn: (pp, q, t) => fn(t) }); }
// Shapes only (bars, slices, dots). When a later item is spoken, earlier ones step back; `restore` brings all back. Text is never dimmed.
function spot(items, restore) {
  const back = restore === undefined ? Infinity : cue(restore);
  items.forEach((it, i) => { const next = items[i + 1]; if (!next) return; const off = cue(next.at);
    live(t => { const d = E.sine(clamp((t - off) / 0.4)) * (1 - E.sine(clamp((t - back) / 0.5)));
      [it.node, ...(it.extra || [])].forEach(n => { n.style.filter = d > 0.001 ? `opacity(${(1 - 0.6 * d).toFixed(3)})` : ''; }); }); });
}
// Text lists: a 6 px bar in the item's colour slides to the row being spoken (0.6 s, outExpo). Text stays white.
function marker(rows, x = 112) { // rows: [{node, at, key}]
  const m = el(`<div class="abs" style="left:${x}px;top:0;width:6px;height:0;opacity:0"></div>`);
  const box = rows.map(r => { const b = r.node.getBoundingClientRect(); return [b.top + 6, b.height - 12]; });
  live(t => { let i = -1; rows.forEach((r, k) => { if (t >= cue(r.at)) i = k; });
    if (i < 0) { m.style.opacity = 0; return; }
    const e = E.out(clamp((t - cue(rows[i].at)) / 0.6)), [y0, h0] = box[Math.max(0, i - 1)], [y1, h1] = box[i];
    m.style.opacity = i ? 1 : e; m.style.top = (i ? y0 + (y1 - y0) * e : y1) + 'px';
    m.style.height = (i ? h0 + (h1 - h0) * e : h1 * e) + 'px'; m.style.background = `var(--${rows[i].key || 'own'})`; });
}
// Words appear as they are said. span = [start, end] of the spoken phrase (resolve turns "@@phrase" into it).
// Times are spread by characters, which follows speech closely enough for a calm reveal.
function wordsIn(node, span) {
  node.innerHTML = node.innerHTML.split(/(<br\s*\/?>)/).map(part => /^<br/.test(part) ? part :
    part.split(/(\s+)/).map(w => /^\s*$/.test(w) ? w : `<span class="w" style="display:inline-block">${w}</span>`).join('')).join('');
  const ws = [...node.querySelectorAll('.w')], total = ws.reduce((a, w) => a + w.textContent.length, 0); let acc = 0;
  ws.forEach(w => { anim(w, { anim: 'rise', at: span[0] + (span[1] - span[0]) * acc / total + 0.05, dur: 0.45, dist: 14 }); acc += w.textContent.length; });
}
// Names and headlines rise from behind their own baseline, letter-spacing settling from +6 px to -1 px.
function maskRise(node, at, dur = 0.7) {
  const wrap = document.createElement('div'); wrap.style.clipPath = 'inset(-60px -80px -0.12em -80px)';
  node.parentNode.insertBefore(wrap, node); wrap.appendChild(node);
  return anim(node, { anim: 'fn', at, dur: 1.2, ease: false, fn: pp => { const e = E.outQuint(clamp(pp * 1.2 / Math.min(dur, 0.55)));

}
function camTo() { }   // off: once text lands it stays put (owner)
function focusOn(node, at, k = 0.35, ds = 0.04, dur = 1.4) { // move the camera part of the way toward a node's centre

// Shared pieces ----------------------------------------------------------------------------------
// No panels, boxes or veils (owner's rule). Text sits on the shot's empty space, or the graphic has its own
// background image (a blurred still made by proxies.make_still_bg). dim() is kept as a no-op for old scenes.
function dim() { return null; }

// Scenes -----------------------------------------------------------------------------------------
const SCENES = {

      const svg = blk(`<svg width="${sh.w + 10}" height="${sh.h + 10}" style="overflow:visible">${sh.d.map(d => `<path d="${d}" pathLength="1" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="miter" stroke-dasharray="1 1" stroke-dashoffset="1"/>`).join('')}</svg>`, x, y);
      svg.className += ' shadow';
      const paths = [...svg.querySelectorAll('path')], at = cue(it.cue);
      anim(svg, { anim: 'fn', at, dur: 0.9, ease: false, fn: pp => paths.forEach((q, k) => q.setAttribute('stroke-dashoffset', (1 - E.sine(clamp(pp * 1.25 - k * 0.05))).toFixed(4))) });
      if (it.kind === 'elevator' && p.lowerAt !== undefined) {   // the product rides the lift down instead of dropping
        const prod = blk(`<div style="width:56px;height:40px;background:#FFE14D"></div>`, x + 160, y + 42 - 40), plat = blk(`<div style="width:80px;height:6px;background:#fff"></div>`, x + 148, y + 42);
        [prod, plat].forEach(e => { e.style.opacity = 0; anim(e, { anim: 'fn', at: cue(p.lowerAt) - 0.4, dur: 2.6, ease: false, fn: pp => {
          const tt = pp * 2.6, dy = 234 * E.inOut(clamp((tt - 0.4) / 2.0)); e.style.opacity = clamp(tt / 0.3); e.style.transform = `translateY(${dy.toFixed(2)}px)`; } }); });
      }
      anim(blk(`<div class="shadow" style="font:600 56px ${F}">${it.label}</div>`, x, base + 26), { anim: 'up', at: at + 0.25, dist: 32 });
      if (it.value) anim(blk(`<div class="h shadow" style="font-size:${p.valueSize || 130}px;white-space:nowrap">${it.value}</div>`, x, base + 100), { anim: 'up', at: it.valueAt ?? at + 0.4 });
    });
    if (p.source) srcLine(p.source, p.sourceAt ?? firstCue(p), 860, 116);
  },
});
